[package]
name = 'enderecobr'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.81'

[lib]
crate-type = [ "rlib", "staticlib" ]
name = 'enderecobr'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
# Sem `download` (o R baixa o modelo) e com `separador` (o R expõe a
# segmentação). Ver a nota sobre o vendor em AGENTS.md.
enderecobr_rs = { version = "0.7.4", default-features = false, features = ["separador"] }
extendr-api = '0.9.0'
rustc-hash = "2.1.1"

[profile.release]
lto = true
codegen-units = 1
